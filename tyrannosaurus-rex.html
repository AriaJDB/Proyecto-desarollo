<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyrannosaurus Rex | DinoWorld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #b83b26; /* Crimson depredador */
            --dark: #0a0707;    /* Negro carbón cálido */
            --light: #f5f0f0;   /* Blanco hueso */
            --accent: #ff6b4a;  /* Naranja brillante */
            --amber: #e0a96d;   /* Dorado bronce */
            --slate: #2a2424;   /* Gris cálido */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        /* Botón de retroceso */
        .back-btn {
            position: fixed;
            top: 24px; left: 32px;
            z-index: 100;
            display: flex; align-items: center; gap: 8px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            opacity: 0.85;
            transition: opacity 0.2s, transform 0.2s;
        }
        .back-btn:hover { opacity: 1; transform: translateX(-4px); }
        .back-btn::before { content: '←'; font-size: 1.1rem; }

        /* Sección Hero */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            padding: 0 8vw 80px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 70% 40%, rgba(184, 59, 38, 0.2) 0%, #0a0707 70%);
        }

        /* Ilustración de T-Rex */
        .dino-illustration {
            position: absolute;
            right: 3vw; bottom: 0;
            width: clamp(380px, 50vw, 720px);
            max-height: 85vh;
            object-fit: contain;
            object-position: bottom;
            animation: floatIn 1.2s cubic-bezier(.22,1,.36,1) both;
            filter: drop-shadow(0 0 50px rgba(184,59,38,0.45));
        }

        @keyframes floatIn {
            from { transform: translateX(60px) scale(0.95); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 0.95; }
        }

        .hero-text { position: relative; z-index: 2; max-width: 580px; }

        .hero-label {
            font-size: 0.78rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 16px;
            animation: fadeUp 0.8s 0.2s both;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 6vw, 5.5rem);
            line-height: 1.05;
            margin-bottom: 24px;
            animation: fadeUp 0.8s 0.35s both;
        }

        .hero-title em {
            font-style: italic;
            color: var(--accent);
        }

        .hero-sub {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #d1c7c7;
            max-width: 440px;
            animation: fadeUp 0.8s 0.5s both;
        }

        @keyframes fadeUp {
            from { transform: translateY(24px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Footer temporal para Paso 1 */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #161212;
            font-size: 0.8rem;
            color: #555;
        }
        footer a { color: var(--primary); text-decoration: none; }

        @media (max-width: 768px) {
            .dino-illustration { width: 280px; opacity: 0.35; }
            .hero { align-items: center; }
        }
    </style>
</head>
<body>

    <a class="back-btn" href="index.html">Volver a DinoWorld</a>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-bg"></div>

        <!-- Imagen del Tyrannosaurus Rex -->
        <img class="dino-illustration" src="assets/img/t_rex.png" alt="Tyrannosaurus Rex">

        <div class="hero-text">
            <p class="hero-label">Tyrannosauridae · Cretácico Superior</p>
            <h1 class="hero-title">Tyranno<em>saurus</em> Rex</h1>
            <p class="hero-sub">El "rey de los lagartos tiranos". Con una fuerza de mordida devastadora y sentidos hiperdesarrollados, gobernó el final de la era de los dinosaurios.</p>
        </div>
    </section>

    <footer>
        <p>DinoWorld · Exploración Prehistórica &nbsp;|&nbsp; <a href="index.html">← Volver al inicio</a></p>
    </footer>

</body>
</html>
